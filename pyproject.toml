[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uniforensic"
version = "0.1.0"
description = "UniForensic N3: ML-Assisted SQLite Deleted Record Recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "tabulate>=0.9.0",
    "sqlite-dissect>=1.0.0",
    "sqlparse>=0.5.0",
    "tqdm>=4.66.0"
]

[project.scripts]
uniforensic = "uniforensic.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
