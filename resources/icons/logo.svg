<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="64" cy="64" r="58" fill="url(#grad)" />
  <!-- Inner ring (loop symbol) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="white" stroke-width="6" stroke-dasharray="60 20" />
  <!-- Play arrow -->
  <polygon points="54,44 54,84 84,64" fill="white" opacity="0.95" />
  <!-- Small dot accents -->
  <circle cx="36" cy="36" r="4" fill="white" opacity="0.6" />
  <circle cx="92" cy="92" r="4" fill="white" opacity="0.6" />
</svg>
